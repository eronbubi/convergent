<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Confirm your email</title>
  </head>
  <body style="margin:0;padding:0;background:#f3efe6;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3efe6;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#faf8f2;border:1px solid #d9d1c0;border-radius:20px;">
            <tr>
              <td style="padding:36px 36px 8px 36px;font-family:Georgia,'Times New Roman',serif;font-size:22px;color:#1c1a16;">
                Claude<span style="font-style:italic;">motion</span>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 0 36px;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.1;color:#1c1a16;">
                Confirm your email
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 0 36px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#47433b;">
                Click the button to activate your account. After that you can post images and clips with their prompts.
              </td>
            </tr>
            <tr>
              <td style="padding:28px 36px 8px 36px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/welcome"
                   style="display:inline-block;background:#1c1a16;color:#f3efe6;text-decoration:none;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;padding:14px 26px;border-radius:999px;">
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 36px 36px 36px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#7a7468;">
                The link works for 24 hours. If you didn’t sign up for Claudemotion, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
